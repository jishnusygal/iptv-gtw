services:
  pilot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/pilot.db
    volumes:
      - pilot-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    labels:
      - traefik.enable=true
      - traefik.http.routers.pilot.rule=Host(`${DOMAIN:-pilot.example.com}`)
      - traefik.http.routers.pilot.entrypoints=websecure
      - traefik.http.routers.pilot.tls.certresolver=cloudflare
      - traefik.http.services.pilot.loadbalancer.server.port=8000
      - traefik.http.routers.pilot.middlewares=pilot-security
      - traefik.http.middlewares.pilot-security.headers.stsSeconds=31536000
      - traefik.http.middlewares.pilot-security.headers.contentTypeNosniff=true
      - traefik.http.middlewares.pilot-security.headers.referrerPolicy=no-referrer
  traefik:
    image: traefik:v3.6
    profiles: [tls]
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL:-admin@example.com}
      - --certificatesresolvers.cloudflare.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:-}
    ports: ["80:80", "443:443"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - certificates:/letsencrypt
volumes:
  pilot-data:
  certificates:
