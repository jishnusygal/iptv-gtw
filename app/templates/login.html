<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="theme-color" content="#101318"><meta name="referrer" content="no-referrer"><title>Sign in · IPTV-Org Pilot</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/pilot.css"><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script></head>
<body>
<div class="auth-page" x-data="{ username: 'admin', password: '', error: '', signing: false,
  async submit() {
    this.signing = true; this.error = '';
    try {
      const response = await fetch('/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: this.username, password: this.password }) });
      const body = await response.json();
      if (!response.ok) throw new Error(typeof body.detail === 'string' ? body.detail : 'Check your credentials.');
      window.location.href = '/';
    } catch (e) { this.error = e.message; this.signing = false; }
  } }">
<div class="auth-wrap">
<div class="auth-brand"><span class="brand-icon"><svg width="18" height="18" viewBox="0 0 18 18" fill="#fff" aria-hidden="true"><rect y="3" width="18" height="2.6" rx="1.3"/><rect y="7.7" width="13" height="2.6" rx="1.3"/><rect y="12.4" width="8.5" height="2.6" rx="1.3"/></svg></span> IPTV-Org <strong>Pilot</strong></div>
<div class="panel auth-card">
<h1>Sign in</h1>
<p class="muted">{{ host }}</p>
<form @submit.prevent="submit()">
<label class="auth-field"><span>Username</span><input name="username" autocomplete="username" required autofocus x-model="username"></label>
<label class="auth-field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required x-model="password"></label>
<p class="error" role="alert" x-show="error" x-transition.opacity.duration.150ms x-text="error" x-cloak></p>
<button class="primary auth-submit" type="submit" :disabled="signing" x-text="signing ? 'Signing in…' : 'Sign in'"></button>
</form>
</div>
<p class="auth-footnote">Self-hosted channel manager. Your credentials stay on this server.</p>
</div>
</div>
</body></html>
